name: Build and deploy shield editor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update mask manifest
        run: node sync-dv-resources.mjs

      - name: Stamp deployed version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'site-config.js';
          const revision = process.env.GITHUB_SHA.slice(0, 7);
          const source = fs.readFileSync(file, 'utf8');
          const stamped = source.replace(
            /version:\s*'([^']+)'/,
            (_, version) => `version: '${version.split('+')[0]}+${revision}'`,
          );
          fs.writeFileSync(file, stamped);
          console.log(`Deploying version ${stamped.match(/version:\s*'([^']+)'/)[1]}`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
